# tool config lives in `pyproject.toml` (the `[tool.ruff]` section).
# CI runs this file verbatim, see `.github/workflows/ci.yml`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - { id: trailing-whitespace }
      - { id: end-of-file-fixer }
      - { id: check-yaml }
      - { id: check-added-large-files, args: ["--maxkb=500"] }
      - { id: check-case-conflict }
      - { id: detect-private-key }

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
