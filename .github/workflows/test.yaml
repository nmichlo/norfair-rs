name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # rust and python are tested separately: the shared pytest workflow cannot
  # express `cargo test`, and the python side needs the extension built first.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build and install
        run: uv run maturin develop --release
      - name: Run pytest
        run: uv run pytest python/tests -v

  # The branch-protection gate. A required status check is matched by name, and
  # every name the jobs above produce is unstable: a reusable job is called
  # "<caller-job> / <callee-job>" and a matrix job is called "job (3.12)", so
  # renaming a job or changing a matrix silently stops the required check from
  # reporting -- and every PR then waits on it forever. This job is plain, so
  # its check is always exactly "test".
  test:
    needs: [rust, python]
    # always(), or the gate is skipped when what it guards fails -- and a
    # skipped required check counts as success.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          read -r -a outcomes <<< "${RESULTS}"
          for outcome in "${outcomes[@]}"; do
            [ "${outcome}" = "success" ] || exit 1
          done
