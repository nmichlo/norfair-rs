name: test

on:
  pull_request:
  push:
    branches: [main]

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  # rust and python are tested separately: the shared pytest workflow cannot
  # express `cargo test`, and the python side needs the extension built first.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build and install
        run: uv run maturin develop --release
      - name: Run pytest
        run: uv run pytest python/tests -v

  # The branch-protection gate; see nmichlo/.github/actions/gate for why it
  # exists. `always()` is required, or the gate is skipped when what it guards
  # fails -- and a skipped required check counts as success.
  test:
    needs: [rust, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: nmichlo/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
