# Release: version bump, multi-platform wheels, PyPI + crates.io, GitHub Release.
#
# Triggers:
#   1. PR merged to main  -> bump Cargo.toml, commit, tag, then release
#   2. Manual tag push    -> release the tag as-is (Cargo.toml must already match)
#
# Why one workflow rather than two:
#   Tags pushed with GITHUB_TOKEN do not trigger other workflows, so a separate
#   bump workflow could never start this one. Owning both triggers here fixes
#   that without a PAT. A tag this workflow pushes does not re-enter it.
#
# Unlike the python repos this cannot use the shared reusable release workflow:
#   maturin needs a per-platform build matrix, the version lives in Cargo.toml
#   rather than being derived from the tag by setuptools_scm, and publishing goes
#   to two indexes over OIDC.
#
# Bumping is keyword-driven: put #major, #minor, #patch or #none in the PR title.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write  # For creating GitHub releases

jobs:
  # Only on a real merge. Rewrites Cargo.toml to the next version, commits it,
  # then tags that commit -- so `version-check` below still holds for both paths.
  version-bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vtag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: "0"  # the action reads history to find the last tag

      # DRY_RUN: we need the number before the tag exists, because the tag has to
      # point at the Cargo.toml bump commit rather than at the merge commit.
      - name: Compute next version
        id: vtag
        # pinned to 1.71.0
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: "patch"
          WITH_V: true
          DRY_RUN: true

      - name: Bump Cargo.toml, commit and tag
        env:
          NEW_TAG: ${{ steps.vtag.outputs.new_tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          # only the [package] version, which is the first `version = ` line
          sed -i "0,/^version = \".*\"$/s//version = \"${VERSION}\"/" Cargo.toml
          grep -q "^version = \"${VERSION}\"$" Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${NEW_TAG}"
          git tag "${NEW_TAG}"
          git push origin HEAD:main
          git push origin "${NEW_TAG}"

  # Single source of the version for everything downstream, from whichever
  # trigger fired.
  resolve-version:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.version-bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  # Guards the manual-tag path, where Cargo.toml is hand-edited and can drift.
  # On the merge path version-bump wrote it, so this is a cheap self-check.
  version-check:
    needs: [resolve-version]
    if: always() && needs.resolve-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION=${VERSION#v}
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Git tag version:    $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml has $CARGO_VERSION but tag is v$TAG_VERSION"
            exit 1
          fi
          echo "Version check passed!"
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}

  python-build:
    needs: [resolve-version, version-check]
    if: always() && needs.version-check.result == 'success'
    strategy:
      matrix:
        include:
          # Linux
          - { python-version: "3.12", runs-on: "ubuntu-latest", target: "x86_64" }
          - { python-version: "3.12", runs-on: "ubuntu-latest", target: "aarch64" }
          # Windows (no aarch64 cross-compile support)
          - { python-version: "3.12", runs-on: "windows-latest", target: "x86_64" }
          # macOS
          - { python-version: "3.12", runs-on: "macos-15-intel", target: "x86_64" }
          - { python-version: "3.12", runs-on: "macos-15", target: "aarch64" }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release -i python${{ matrix.python-version }} --out dist
          sccache: true
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}-${{ matrix.runs-on }}-${{ matrix.target }}
          path: dist

  python-sdist:
    needs: [resolve-version, version-check]
    if: always() && needs.version-check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # https://docs.pypi.org/trusted-publishers/
  # https://github.com/pypa/gh-action-pypi-publish
  python-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [python-build, python-sdist]
    if: always() && needs.python-build.result == 'success' && needs.python-sdist.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/norfair-rs
    permissions:
      id-token: write  # For trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # https://crates.io/docs/trusted-publishing
  rust-publish:
    name: Publish to crates.io
    needs: [resolve-version, version-check]
    runs-on: ubuntu-latest
    if: always() && needs.version-check.result == 'success'
    environment: release  # Optional: for enhanced security
    permissions:
      id-token: write     # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create GitHub Release with artifacts
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-version, python-build, python-sdist, python-publish, rust-publish]
    if: always() && needs.python-publish.result == 'success' && needs.rust-publish.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          files: dist/*
